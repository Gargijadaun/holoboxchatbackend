<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Conversation Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #0f0f1a; color: #e0e0e0; }
  
  header { background: #1a1a2e; padding: 20px 30px; border-bottom: 2px solid #7c3aed; }
  header h1 { color: #a78bfa; font-size: 1.5rem; }
  
  .container { display: flex; height: calc(100vh - 65px); }
  
  /* Left Panel */
  .sidebar { width: 340px; background: #16213e; border-right: 1px solid #2d2d4e; overflow-y: auto; }
  .sidebar-header { padding: 16px; border-bottom: 1px solid #2d2d4e; }
  .sidebar-header input[type="date"] {
    width: 100%; padding: 8px 12px; background: #0f0f1a;
    border: 1px solid #7c3aed; border-radius: 8px; color: #e0e0e0; font-size: 0.9rem;
  }
  .session-item {
    padding: 14px 16px; border-bottom: 1px solid #1e1e3e; cursor: pointer;
    transition: background 0.2s;
  }
  .session-item:hover, .session-item.active { background: #1e1e4e; border-left: 3px solid #7c3aed; }
  .session-date { font-size: 0.75rem; color: #888; }
  .session-count { font-size: 0.75rem; color: #a78bfa; margin-top: 3px; }
  
  /* Right Panel */
  .chat-panel { flex: 1; display: flex; flex-direction: column; }
  .chat-header { padding: 16px 24px; background: #16213e; border-bottom: 1px solid #2d2d4e; }
  .chat-header h2 { font-size: 1rem; color: #a78bfa; }
  .messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  
  .bubble { max-width: 70%; padding: 10px 14px; border-radius: 12px; font-size: 0.9rem; line-height: 1.5; }
  .bubble.player { align-self: flex-end; background: #7c3aed; color: white; border-bottom-right-radius: 3px; }
  .bubble.character { align-self: flex-start; background: #1e293b; color: #e0e0e0; border-bottom-left-radius: 3px; }
  .bubble .meta { font-size: 0.7rem; opacity: 0.7; margin-bottom: 4px; }

  .empty { text-align: center; color: #555; margin-top: 80px; font-size: 0.95rem; }
</style>
</head>
<body>

<header><h1>🎮 Convai Conversation Dashboard</h1></header>

<div class="container">
  <div class="sidebar">
    <div class="sidebar-header">
      <input type="date" id="datePicker" onchange="loadSessions()">
    </div>
    <div id="sessionList"><p class="empty" style="padding:20px">Pick a date</p></div>
  </div>

  <div class="chat-panel">
    <div class="chat-header"><h2 id="chatTitle">Select a session to view</h2></div>
    <div class="messages" id="messages">
      <p class="empty">← Choose a session from the left panel</p>
    </div>
  </div>
</div>

<script>
  const API = 'http://localhost:3000/api';

  // Set today's date by default
  document.getElementById('datePicker').value = new Date().toISOString().split('T')[0];
  loadSessions();

  async function loadSessions() {
    const date = document.getElementById('datePicker').value;
    const res = await fetch(`${API}/sessions?date=${date}`);
    const sessions = await res.json();
    const list = document.getElementById('sessionList');

    if (!sessions.length) {
      list.innerHTML = '<p class="empty" style="padding:20px">No sessions found</p>';
      return;
    }

    list.innerHTML = sessions.map(s => `
      <div class="session-item" onclick="loadMessages('${s.id}', this)">
        <div>${new Date(s.start_time).toLocaleTimeString()}</div>
        <div class="session-date">${new Date(s.start_time).toLocaleDateString()}</div>
        <div class="session-count">${s.message_count} messages</div>
      </div>
    `).join('');
  }

  async function loadMessages(sessionId, el) {
    document.querySelectorAll('.session-item').forEach(e => e.classList.remove('active'));
    el.classList.add('active');

    const res = await fetch(`${API}/sessions/${sessionId}/messages`);
    const msgs = await res.json();

    document.getElementById('chatTitle').textContent =
      `Session: ${sessionId.slice(0,8)}… — ${msgs.length} messages`;

    document.getElementById('messages').innerHTML = msgs.map(m => {
      const isPlayer = m.sender === 'Player';
      const time = new Date(m.timestamp).toLocaleTimeString();
      return `
        <div class="bubble ${isPlayer ? 'player' : 'character'}">
          <div class="meta">${m.sender} · ${time}</div>
          ${m.message}
        </div>`;
    }).join('');
  }
</script>
</body>
</html>
